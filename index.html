<!doctype html>
<html lang="en" data-theme="dark" data-density="comfortable">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Logic Studio: digital logic simulator</title>
    <meta name="description" content="Build and simulate digital logic circuits in your browser: gates, adders, multiplexers, latches and flip-flops, with live signals, truth tables and simplified expressions. Free, no sign-up." />
    <meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e0f12" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Link previews (%SITE_URL% is filled in at build time, see vite.config.ts) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Logic Studio" />
    <meta property="og:title" content="Logic Studio: digital logic simulator" />
    <meta property="og:description" content="Build and simulate logic circuits in your browser, with live signals, truth tables and simplified expressions." />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Logic Studio editor with a full adder circuit" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the saved theme before first paint to avoid a light/dark flash
      (function () {
        try {
          var prefs = JSON.parse(localStorage.getItem('logic_studio_ui_prefs') || '{}');
          var theme = prefs.theme || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          document.documentElement.dataset.theme = theme;
          if (prefs.density) document.documentElement.dataset.density = prefs.density;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
